version: '3.8'

services:
  embedding-service:
    build: ./embedding_service
    container_name: embedding-service
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cuda
      - MODEL_CACHE_DIR=/models
    volumes:
      - embedding-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - ml-network

  reranking-service:
    build: ./reranking_service
    container_name: reranking-service
    ports:
      - "8001:8000"
    environment:
      - DEVICE=cuda
      - MODEL_CACHE_DIR=/models
    volumes:
      - reranking-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - ml-network

  vision-service:
    build: ./vision_service
    container_name: vision-service
    ports:
      - "8004:8004"
    environment:
      - VISION_MODEL_NAME=Salesforce/blip-image-captioning-large
      - VISION_USE_GPU=true
      - VISION_MAX_NEW_TOKENS=200
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - C:\Users\lyr1csan\source:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    networks:
      - ml-network

  transcription-service:
    build: ./transcription_service
    container_name: transcription-service
    ports:
      - "8005:8005"
    environment:
      - TRANSCRIPTION_MODEL_SIZE=small
      - TRANSCRIPTION_USE_GPU=true
      - TRANSCRIPTION_MAX_AUDIO_DURATION_SECONDS=600
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    networks:
      - ml-network

  video-service:
    build: ./video_service
    container_name: video-service
    ports:
      - "8006:8006"
    environment:
      - VIDEO_VISION_SERVICE_URL=http://vision-service:8004
      - VIDEO_TRANSCRIPTION_SERVICE_URL=http://transcription-service:8005
      - VIDEO_FRAME_EXTRACTION_INTERVAL_SECONDS=5.0
      - VIDEO_MAX_FRAMES=100
      - VIDEO_MAX_VIDEO_DURATION_SECONDS=1800
      - VIDEO_REQUEST_TIMEOUT_SECONDS=120
    volumes:
      - C:\Users\lyr1csan\source:/data
    depends_on:
      vision-service:
        condition: service_healthy
      transcription-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ml-network

volumes:
  embedding-models:
    driver: local
  reranking-models:
    driver: local

networks:
  ml-network:
    driver: bridge